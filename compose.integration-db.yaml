name: clearauth-codex-20261117-01a1eafc

services:
  postgres:
    image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    environment:
      POSTGRES_DB: clearauth_integration
      POSTGRES_USER: clearauth
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearauth -d clearauth_integration"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

secrets:
  db_password:
    file: ./.integration-db/password
