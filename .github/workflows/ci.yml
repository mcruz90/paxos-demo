name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-check:
    name: Frontend (vitest + tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      # Vitest includes the anchor-join parity guard (scenarios_parity.test.ts)
      # — drift gates must actually gate, not run only on developer machines.
      - run: npm test
      - run: npm run build

  wire-types-freshness:
    name: Generated wire types are fresh (OpenAPI → TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      # Regenerate the OpenAPI dump (from the live Pydantic models) and the
      # TypeScript wire types, then fail if the committed artifacts are stale.
      # This replaces the hand-maintained src/types.ts parity guard for wire
      # shapes — same drift-gate philosophy as scenarios_parity.test.ts, now
      # applied to the backend↔frontend contract (ADR-0012). A stale generated
      # file must fail CI, not linger.
      - name: Regenerate OpenAPI dump + wire types
        run: |
          npm run api:dump
          npm run api:types
      - name: Fail if generated wire types are stale
        run: git diff --exit-code -- openapi.json src/generated/api-types.d.ts

  backend-unit:
    name: Backend unit + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract OCR (required by pytesseract)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      # Supply-chain gate — a finding fails the build (no `|| true` escape
      # hatch; CLAUDE.md Dependency Security).
      - name: Run pip-audit (supply chain check)
        working-directory: backend
        run: uv run pip-audit --desc
      - name: Golden-set PHI + fixture-integrity scan
        working-directory: backend
        run: uv run pytest tests/unit/test_golden_compliance.py -v --tb=short
      - name: Run unit + contract tests
        working-directory: backend
        run: uv run pytest tests/unit tests/contract -v --tb=short

  backend-integration:
    name: Backend integration tests (MockLLMBackend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract OCR (required by pytesseract)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Run integration tests
        working-directory: backend
        run: uv run pytest tests/integration -v --tb=short

  lint:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .
      - name: Mypy type check
        working-directory: backend
        run: uv run mypy . --ignore-missing-imports

# NOTE: the live-LLM eval CLI (planned as evals/run_evals.py, Sprint 4) will not
# run in CI — it needs a live LLM and costs tokens. Run manually, or via
# workflow_dispatch once a provider is selected and its API key secret exists.
