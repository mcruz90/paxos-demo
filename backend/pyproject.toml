[project]
name = "paxos-backend"
version = "0.1.0"
description = "PaxOS prior authorization appeal generation backend"
requires-python = ">=3.12"
dependencies = [
  # API + pipeline
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  # Pin urllib3 explicitly: >=2.7.0 fixes CVE-2026-44431 (cross-origin header leak, CVSS 7.5).
  # Without this pin, a transitive resolver choice may land on an older version.
  "urllib3>=2.7.0",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  # Required by third_party/fhi/generate_appeal.py (forked upstream code);
  # first-party code uses stdlib logging.
  "loguru>=0.7",
  # LLM backends (provider decision open — groq is one option behind ml.llm_backend.LLMBackend)
  "groq>=0.11",
  # ETL-1: denial letter ingestion
  # pytesseract wraps the Tesseract 5.x binary — no PyTorch, no ML dep chain.
  # Requires system package: tesseract-ocr (see CI and Dockerfile).
  # Replaces easyocr (last major update 2021; large PyTorch dep chain).
  "pytesseract>=0.3.13",
  "pymupdf>=1.24",
  "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx",
  "mypy>=1.11",
  "ruff>=0.6",
  "pip-audit>=2.7",
]

# Deferred — a package stays in [dependencies] only while something imports it
# (docs/project-review-hardening.md item 11). Re-adding any of these requires
# the CLAUDE.md pre-install security check.
# "dspy-ai>=2.4"              # ETL-3: EHR entity extraction (Phase 1 Milestone 1.3)
# "sentence-transformers>=3"  # ETL-2: chunk embeddings for Qdrant
# "qdrant-client>=1.10"       # ETL-2: vector store (Phase 1 Milestone 1.2)
# "langgraph>=0.2"            # S3 TierRouter — adopt-or-drop decision pending
# "langchain-core>=1.3.3,<2.0.0"  # with langgraph; >=1.3.3 fixes CVE-2026-44843 (CVSS 8.2)
# "langfuse>=2.0"             # observability — re-vet its network calls before re-adding (PHI codebase)
# "slowapi>=0.1"              # rate limiting — wire when the API is internet-facing
# "pydantic-settings>=2.5"    # typed settings — env vars are read via os.environ today

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  "third_party",   # forked upstream code — do not reformat
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["third_party.*"]
ignore_errors = true
