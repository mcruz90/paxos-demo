[project]
name = "paxos-backend"
version = "0.1.0"
description = "PaxOS prior authorization appeal generation backend"
requires-python = ">=3.12"
dependencies = [
  # API + pipeline
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langgraph>=0.2",
  # Pin langchain-core: >=1.3.3 fixes CVE-2026-44843 (prompt-injection bypass, CVSS 8.2).
  # Ceiling <2.0.0 guards against breaking LangGraph node API changes in a future major.
  "langchain-core>=1.3.3,<2.0.0",
  "httpx>=0.27",
  # Pin urllib3 explicitly: >=2.7.0 fixes CVE-2026-44431 (cross-origin header leak, CVSS 7.5).
  # Without this pin, httpx/requests may resolve an older transitive version.
  "urllib3>=2.7.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "loguru>=0.7",
  "slowapi>=0.1",
  # LLM backends
  "groq>=0.11",
  # Observability + evals
  "langfuse>=2.0",
  # ETL-1: denial letter ingestion
  # pytesseract wraps the Tesseract 5.x binary — no PyTorch, no ML dep chain.
  # Requires system package: tesseract-ocr (see CI and Dockerfile).
  # Replaces easyocr (last major update 2021; large PyTorch dep chain).
  "pytesseract>=0.3.13",
  "pymupdf>=1.24",
  "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx",
  "mypy>=1.11",
  "ruff>=0.6",
  "pip-audit>=2.7",
]

# Deferred — uncomment when Phase 1 infrastructure lands:
# "dspy-ai>=2.4"              # ETL-3: EHR entity extraction (Phase 1 Milestone 1.3)
# "sentence-transformers>=3"  # ETL-2: chunk embeddings for Qdrant
# "qdrant-client>=1.10"       # ETL-2: vector store (Phase 1 Milestone 1.2)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  "third_party",   # forked upstream code — do not reformat
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["third_party/"]
