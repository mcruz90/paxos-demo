[project]
name = "paxos-backend"
version = "0.1.0"
description = "PaxOS prior authorization appeal generation backend"
requires-python = ">=3.12"
dependencies = [
  # API + pipeline
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  # Baseline 2.7.0 was flagged by GHSA-8988-9cw3-xx77,
  # GHSA-gh4c-6fx4-qh6g and GHSA-vxq7-64xx-v4gw; audit reports 2.8.0 fixed.
  "urllib3==2.8.0",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  # Required by third_party/fhi/generate_appeal.py (forked upstream code);
  # first-party code uses stdlib logging.
  "loguru>=0.7",
  # LLM backends (provider decision open — groq is one option behind ml.llm_backend.LLMBackend)
  "groq>=0.11",
  # ETL-1: denial letter ingestion
  # pytesseract wraps the Tesseract 5.x binary — no PyTorch, no ML dep chain.
  # Requires system package: tesseract-ocr (see CI and Dockerfile).
  # Replaces easyocr (last major update 2021; large PyTorch dep chain).
  "pytesseract>=0.3.13",
  "pillow==13.0.0",  # first-party image ingestion imports PIL directly
  "pymupdf>=1.24",
  "python-dateutil>=2.9",
  # Orchestrator (ADR-0001, re-added Sprint 2 Slice 0 via the pre-install check).
  # Historical security floors: langchain-core >=1.3.3 fixes CVE-2026-44843;
  # langgraph-checkpoint >=3.0 fixes CVE-2025-67644 (SQL injection in
  # the sqlite checkpointer — not installed, floor pinned per CLAUDE.md anyway).
  # NOTE: langchain-core hard-requires langsmith (LangChain's SaaS tracing SDK);
  # it is inert without env opt-in, and main.py force-disables it (PHI rule).
  # LangGraph 1.2.14 imposes stricter core>=1.4.7 and checkpoint>=4.1 floors;
  # the exact resolved versions remain governed by uv.lock.
  "langgraph==1.2.14",
  "langchain-core>=1.4.7,<2.0.0",
  "langgraph-checkpoint>=4.1.0,<5.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx",
  "mypy>=1.11",
  "ruff>=0.6",
  "pip-audit>=2.7",
]

# Deferred — a package stays in [dependencies] only while something imports it
# (docs/project-review-hardening.md item 11). Re-adding any of these requires
# the CLAUDE.md pre-install security check.
# "dspy-ai>=2.4"              # ETL-3: EHR entity extraction (Phase 1 Milestone 1.3)
# "sentence-transformers>=3"  # ETL-2: chunk embeddings for Qdrant
# "qdrant-client>=1.10"       # ETL-2: vector store (Phase 1 Milestone 1.2)
# "langfuse>=2.0"             # observability — re-vet its network calls before re-adding (PHI codebase)
# "slowapi>=0.1"              # rate limiting — wire when the API is internet-facing
# "pydantic-settings>=2.5"    # typed settings — env vars are read via os.environ today

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  "third_party",   # forked upstream code — do not reformat
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["third_party.*"]
ignore_errors = true

# Security constraints govern existing transitive dependencies without making
# unused packages direct runtime dependencies. Reviewed 2026-11-18.
[tool.uv]
constraint-dependencies = [
  "anyio==4.14.2",
  "certifi==2026.10.23",
  "filelock==4.2.1",
  "langgraph-sdk==0.4.6",
  "msgpack==1.2.3",
  "pip==26.2",
]
